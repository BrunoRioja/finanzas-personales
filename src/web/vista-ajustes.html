<script>
'use strict';
VISTAS.ajustes = async function (cont) {
  const [cat, lectura, reglas, telegram, version] = await Promise.all([cargarCatalogos(), api('estadoLectura'), api('listarReglas'),
    api('estadoTelegram'), api('estadoVersion').catch(() => null)]);
  const chips = tipo => cat.categorias.filter(c => c.tipo === tipo).map(c =>
    '<button type="button" class="chip' + (c.activa ? '' : ' apagado') + '" data-cat="' + esc(c.id) + '">' + esc(c.emoji + ' ' + c.nombre) +
    (c.rol ? ' <span class="etiqueta-mini amb">' + (c.rol === 'prestamo' ? 'préstamos' : 'reembolsos') + '</span>' : '') + '</button>').join('');
  cont.innerHTML = '<div class="cabecera"><h1>Ajustes</h1></div>' +
    '<section class="tarjeta seccion"><div class="etiqueta">General</div><div class="dos-col">' +
      campo('Tu nombre', '<input class="entrada" id="a-nombre" value="' + esc(cat.config.nombre) + '">') +
      campo('Tipo de cambio USD → PEN', '<input class="entrada num" id="a-tc" inputmode="decimal" value="' + esc(cat.config.ultimo_tc) + '">') +
    '</div><button type="button" class="boton primario" id="a-guardar">Guardar</button></section>' +
    '<section class="tarjeta seccion">' +
      '<div class="cabecera-seccion"><div class="etiqueta">Categorías de gasto</div><button type="button" class="boton" data-nueva="gasto">+ Nueva</button></div>' +
      '<div class="chips">' + chips('gasto') + '</div>' +
      '<div class="cabecera-seccion" style="margin-top:16px"><div class="etiqueta">Categorías de ingreso</div><button type="button" class="boton" data-nueva="ingreso">+ Nueva</button></div>' +
      '<div class="chips">' + chips('ingreso') + '</div>' +
    '</section>' +
    '<section class="tarjeta seccion">' +
      '<div class="cabecera-seccion"><div class="etiqueta">Ámbitos (para qué fue el gasto)</div><button type="button" class="boton" id="a-nuevo-ambito">+ Nuevo</button></div>' +
      '<div class="chips">' + (cat.ambitos || []).map(a => '<button type="button" class="chip' + (a.activo ? '' : ' apagado') + '" data-amb="' + esc(a.id) + '">' +
        esc((a.emoji ? a.emoji + ' ' : '') + a.nombre) + '</button>').join('') + '</div>' +
      '<p class="tenue" style="margin:8px 0 0;font-size:12px">Si no eliges uno, el gasto queda en ' + esc(ambito('personal').nombre) + '.</p>' +
    '</section>' +
    seccionLectura(lectura) + seccionTelegram(telegram, cat.cuentas) + seccionReglas(reglas) +
    '<section class="tarjeta seccion"><div class="etiqueta">Datos</div>' +
      '<p class="tenue" style="margin:0">Todo vive en tu propia Google Sheet, en tu cuenta de Google.</p>' +
      '<div class="acciones"><a class="boton" href="' + esc(cat.urlHoja) + '" target="_blank" rel="noopener">Abrir Google Sheet</a>' +
      '<button type="button" class="boton" id="a-demo">' + (cat.modoDemo ? 'Salir del modo demo' : 'Ver con datos demo') + '</button></div>' +
    '</section>' + seccionAcercaDe(version);
  $('#a-guardar').onclick = async e => {
    e.target.disabled = true;
    try {
      await api('guardarAjustes', { nombre: $('#a-nombre').value, ultimo_tc: $('#a-tc').value });
      aviso('Ajustes guardados');
      mostrar('ajustes');
    } catch (err) {
      aviso(err.message, true);
      e.target.disabled = false;
    }
  };
  cont.querySelectorAll('[data-cat]').forEach(b => {
    b.onclick = () => { const c = cat.categorias.find(x => x.id === b.dataset.cat); abrirFormCategoria(c, c.tipo); };
  });
  cont.querySelectorAll('[data-amb]').forEach(b => { b.onclick = () => abrirFormAmbito(cat.ambitos.find(a => a.id === b.dataset.amb)); });
  $('#a-nuevo-ambito').onclick = () => abrirFormAmbito(null);
  cont.querySelectorAll('[data-nueva]').forEach(b => { b.onclick = () => abrirFormCategoria(null, b.dataset.nueva); });
  enlazarLectura();
  enlazarTelegram();
  enlazarReglas();
  enlazarAcercaDe();
  $('#a-demo').onclick = async e => {
    e.target.disabled = true;
    try {
      await api(cat.modoDemo ? 'salirDemo' : 'cargarDemo');
      iniciar();
    } catch (err) {
      aviso(err.message, true);
      e.target.disabled = false;
    }
  };
};

const FRECUENCIAS = [
  ['apagada', 'Apagada'], ['5', 'Cada 5 minutos'], ['15', 'Cada 15 minutos'], ['30', 'Cada 30 minutos'],
  ['60', 'Cada hora'], ['manual', 'Solo cuando toque "Revisar ahora"'],
];

// Versión instalada y "Buscar actualizaciones": solo consulta GitHub al tocar el botón.
function seccionAcercaDe(v) {
  return '<section class="tarjeta seccion"><div class="etiqueta">Acerca de</div>' +
    '<p style="margin:0">Finanzas personales' + (v ? ' · versión <b class="num">' + esc(v.actual) + '</b>' : '') + '</p>' +
    '<div class="resultado-lectura" id="av-resultado" hidden></div>' +
    '<div class="acciones"><button type="button" class="boton" id="av-buscar">Buscar actualizaciones</button>' +
    (v ? '<a class="boton" href="' + esc(v.repo) + '" target="_blank" rel="noopener">Código en GitHub</a>' +
      '<a class="boton" href="' + esc(v.cambios) + '" target="_blank" rel="noopener">Novedades</a>' : '') +
    '</div></section>';
}

function textoActualizacion(r) {
  const enlace = (url, texto) => '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(texto) + '</a>';
  if (r.error) return 'No pude consultar GitHub. Intenta más tarde.';
  if (!r.hayNueva) return '✓ Tienes la última versión (' + esc(r.actual) + ').';
  return '🎉 Hay una versión nueva (' + esc(r.ultima) + '). ' + enlace(r.cambios, 'Novedades') + ' · ' + enlace(r.actualizar, 'Cómo actualizar') +
    '<br>Si adaptaste la lectura de correos de tu banco, al actualizar se pierde ese cambio: pídele a tu Claude que lo vuelva a aplicar. ' +
    enlace(r.adaptarBanco, 'Cómo hacerlo');
}

function enlazarAcercaDe() {
  $('#av-buscar').onclick = async e => {
    const caja = $('#av-resultado');
    e.target.disabled = true;
    e.target.textContent = 'Buscando…';
    try {
      const r = await api('buscarActualizacion');
      caja.className = 'resultado-lectura' + (r.error ? ' mal' : r.hayNueva ? '' : ' ok');
      caja.innerHTML = textoActualizacion(r);
    } catch (err) {
      caja.className = 'resultado-lectura mal';
      caja.textContent = err.message;
    }
    caja.hidden = false;
    e.target.disabled = false;
    e.target.textContent = 'Buscar actualizaciones';
  };
}
// Resultado de la última acción de lectura: se muestra fijo hasta la siguiente.
let resultadoLectura = null;

function seccionLectura(l) {
  const estadoTexto = l.ultima_revision ? 'Última revisión: ' + l.ultima_revision + ' · ' + l.info : 'Aún no se ha revisado ningún correo.';
  const horas = Array.from({ length: 25 }, (_, i) => String(i));
  const etiquetas = horas.map(h => h + ':00');
  const resultado = resultadoLectura
    ? '<div class="resultado-lectura ' + resultadoLectura.clase + '" id="l-resultado">' + esc(resultadoLectura.texto) +
      (resultadoLectura.verRevisar ? ' <button type="button" class="boton" id="l-ver-revisar">Ver por revisar</button>' : '') + '</div>'
    : '<div class="resultado-lectura" id="l-resultado" hidden></div>';
  return '<section class="tarjeta seccion"><div class="etiqueta">Lectura de correos (BCP y Yape)</div>' +
    '<p class="tenue" style="margin:0 0 10px;font-size:13px">' + esc(estadoTexto) + '</p>' + resultado +
    '<div class="dos-col">' +
      campo('Frecuencia', seleccion('l-frec', FRECUENCIAS.map(f => f[0]), String(l.frecuencia), FRECUENCIAS.map(f => f[1]))) +
      campo('Importar correos desde', '<input class="entrada" type="date" id="l-desde" value="' + esc(l.importar_desde) + '">') +
    '</div>' +
    '<div class="dos-col">' +
      campo('Leer automáticamente desde las', seleccion('l-inicio', horas.slice(0, 24), String(l.horario_inicio), etiquetas.slice(0, 24))) +
      campo('hasta las', seleccion('l-fin', horas.slice(1), String(l.horario_fin), etiquetas.slice(1))) +
    '</div>' +
    '<label class="check"><input type="checkbox" id="l-etiquetar"' + (l.etiquetar ? ' checked' : '') + '> Etiquetar en Gmail los correos leídos (Finanzas/Procesado)</label>' +
    '<div class="acciones" id="l-acciones"><button type="button" class="boton primario" id="l-guardar">Guardar</button>' +
    (l.activa ? '<button type="button" class="boton" id="l-revisar">Revisar ahora</button><button type="button" class="boton" id="l-importar">Importar</button>' +
      '<button type="button" class="boton" id="l-releer">Volver a leer los sin cuenta y los no leídos</button>' : '') +
    '</div></section>';
}

function enlazarLectura() {
  $('#l-guardar').onclick = e => guardarLectura(e.target);
  const revisar = $('#l-revisar');
  if (revisar) revisar.onclick = e => ejecutarLectura(e.target, 'Revisando', () => api('revisarCorreos'));
  const importar = $('#l-importar');
  if (importar) importar.onclick = e => ejecutarLectura(e.target, 'Importando', () => api('importarCorreosDesde', $('#l-desde').value));
  const releer = $('#l-releer');
  if (releer) releer.onclick = e => ejecutarLectura(e.target, 'Volviendo a leer', () => api('volverALeerCorreos'));
  const ver = $('#l-ver-revisar');
  if (ver) ver.onclick = () => mostrar('revisar');
}

async function guardarLectura(boton) {
  boton.disabled = true;
  try {
    await api('configurarLectura', {
      frecuencia: $('#l-frec').value, etiquetar: $('#l-etiquetar').checked, importar_desde: $('#l-desde').value,
      horario_inicio: Number($('#l-inicio').value), horario_fin: Number($('#l-fin').value),
    });
    resultadoLectura = { clase: 'ok', texto: '✅ Lectura de correos guardada.' };
    mostrar('ajustes');
  } catch (err) {
    aviso(err.message, true);
    boton.disabled = false;
  }
}

// Ejecuta la lectura y, si quedan correos, sigue tanda por tanda mostrando el avance.
async function ejecutarLectura(boton, verbo, primera) {
  document.querySelectorAll('#l-acciones button').forEach(b => { b.disabled = true; });
  boton.textContent = verbo + '…';
  const caja = $('#l-resultado');
  const progreso = texto => { caja.hidden = false; caja.className = 'resultado-lectura'; caja.textContent = texto; };
  progreso('⏳ ' + verbo + ' correos… puede tardar hasta un minuto. No cierres esta pantalla.');
  const total = { leidos: 0, creados: 0, porRevisar: 0, pendientes: 0, borrados: 0 };
  try {
    let r = await primera();
    for (let vuelta = 1; ; vuelta++) {
      if (r.omitida) {
        resultadoLectura = { clase: 'mal', texto: '⚠️ ' + r.mensaje };
        break;
      }
      Object.keys(total).forEach(k => { total[k] += r[k] || 0; });
      if (!r.restantes || vuelta >= 20) {
        resultadoLectura = { clase: 'ok', texto: textoResultado(total, r.restantes), verRevisar: total.porRevisar + total.pendientes > 0 };
        break;
      }
      progreso('⏳ ' + verbo + '… leídos ' + total.leidos + ' correos · faltan ' + r.restantes);
      r = await api('revisarCorreos');
    }
  } catch (err) {
    resultadoLectura = { clase: 'mal', texto: '❌ ' + err.message };
  }
  mostrar('ajustes');
}

function textoResultado(t, restantes) {
  if (!t.leidos && !t.borrados) return '✅ Listo: no había correos nuevos.';
  let texto = '✅ Listo: ' + (t.borrados ? t.borrados + ' vueltos a leer · ' : '') +
    t.leidos + ' correos leídos · ' + t.creados + ' movimientos';
  if (t.porRevisar) texto += ' · ' + t.porRevisar + ' por revisar';
  if (t.pendientes) texto += ' · ' + t.pendientes + (t.pendientes === 1 ? ' no leído' : ' no leídos');
  if (restantes) texto += ' · aún faltan ' + restantes + ' (toca Importar otra vez)';
  return texto;
}

function seccionReglas(reglas) {
  const filas = reglas.length ? reglas.map(r => {
    const c = categoria(r.categoria_id);
    return '<div class="fila-simple"><span>' + esc(r.patron) + ' → ' + esc(c.emoji + ' ' + c.nombre) +
      ' <span class="tenue">· ' + r.usos + ' usos</span>' +
      (r.en_pausa ? '<span class="etiqueta-mini" title="Su categoría es de préstamos o reembolsos: esos movimientos quedan en Por revisar">en pausa (préstamos)</span>' : '') + '</span>' +
      '<button type="button" class="boton" data-regla="' + esc(r.id) + '" aria-label="Borrar regla">✕</button></div>';
  }).join('') : '<p class="tenue" style="margin:0;font-size:13px">Aún no hay reglas. Se crean al categorizar en "Por revisar".</p>';
  return '<section class="tarjeta seccion"><div class="etiqueta">Reglas (comercio → categoría)</div>' + filas + '</section>';
}

function enlazarReglas() {
  document.querySelectorAll('[data-regla]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        await api('eliminarRegla', b.dataset.regla);
        aviso('Regla borrada');
        mostrar('ajustes');
      } catch (err) {
        aviso(err.message, true);
        b.disabled = false;
      }
    };
  });
}

function abrirFormAmbito(a) {
  const v = a || { nombre: '', emoji: '', activo: true };
  const caja = abrirModal('<h2 class="titulo-modal">' + (a ? 'Editar ámbito' : 'Nuevo ámbito') + '</h2>' +
    '<div class="dos-col" style="grid-template-columns:1fr 80px">' +
      campo('Nombre', '<input class="entrada" id="b-nombre" value="' + esc(v.nombre) + '">') +
      campo('Emoji', '<input class="entrada" id="b-emoji" maxlength="8" value="' + esc(v.emoji) + '">') +
    '</div>' +
    (a && a.id !== 'personal' ? '<label class="check"><input type="checkbox" id="b-activo"' + (v.activo ? ' checked' : '') + '> Ámbito activo (desactivarlo lo oculta al registrar, pero conserva el historial)</label>' : '') +
    '<div class="acciones"><button type="button" class="boton" id="b-cancelar">Cancelar</button><button type="button" class="boton primario" id="b-guardar">Guardar</button></div>');
  $('#b-cancelar', caja).onclick = cerrarModal;
  $('#b-guardar', caja).onclick = async e => {
    const activo = $('#b-activo', caja);
    e.target.disabled = true;
    try {
      await api('guardarAmbito', { id: a ? a.id : '', nombre: $('#b-nombre', caja).value, emoji: $('#b-emoji', caja).value, activo: activo ? activo.checked : true });
      cerrarModal();
      aviso('Ámbito guardado');
      mostrar('ajustes');
    } catch (err) {
      aviso(err.message, true);
      e.target.disabled = false;
    }
  };
}

// Rol que puede marcar cada tipo de categoría (uno solo por rol entre las activas).
const ROL_POR_TIPO = {
  gasto: ['prestamo', 'Es préstamo', 'Lo que gastes aquí se anota como préstamo y te avisa cuando toca cobrar.'],
  ingreso: ['reembolso', 'Es devolución / reembolso', 'Al elegirla pregunta de qué es: el abono de un préstamo o la devolución de un gasto.'],
};

function abrirFormCategoria(c, tipo) {
  const v = c || { nombre: '', emoji: '', color: '#7c5cff', activa: true, rol: '' };
  const rol = ROL_POR_TIPO[tipo];
  const caja = abrirModal('<h2 class="titulo-modal">' + (c ? 'Editar categoría' : 'Nueva categoría de ' + tipo) + '</h2>' +
    '<div class="dos-col" style="grid-template-columns:1fr 80px 64px">' +
      campo('Nombre', '<input class="entrada" id="k-nombre" value="' + esc(v.nombre) + '">') +
      campo('Emoji', '<input class="entrada" id="k-emoji" maxlength="4" value="' + esc(v.emoji) + '">') +
      campo('Color', '<input class="entrada" type="color" id="k-color" value="' + esc(v.color) + '" style="padding:4px;height:42px">') +
    '</div>' +
    (c ? '<label class="check"><input type="checkbox" id="k-activa"' + (v.activa ? ' checked' : '') + '> Categoría activa (desactivarla la oculta al registrar, pero conserva el historial)</label>' : '') +
    (rol ? '<label class="check"><input type="checkbox" id="k-rol"' + (v.rol === rol[0] ? ' checked' : '') + '> ' + esc(rol[1]) + '</label>' +
      '<p class="tenue" style="margin:-4px 0 0 24px;font-size:12px">' + esc(rol[2]) + ' Solo una categoría puede tenerlo.</p>' : '') +
    '<div class="acciones"><button type="button" class="boton" id="k-cancelar">Cancelar</button><button type="button" class="boton primario" id="k-guardar">Guardar</button></div>');
  $('#k-cancelar', caja).onclick = cerrarModal;
  $('#k-guardar', caja).onclick = async e => {
    e.target.disabled = true;
    try {
      await api('guardarCategoria', {
        id: c ? c.id : '', nombre: $('#k-nombre', caja).value, emoji: $('#k-emoji', caja).value,
        color: $('#k-color', caja).value, tipo: tipo, activa: c ? $('#k-activa', caja).checked : true,
        rol: rol && $('#k-rol', caja).checked ? rol[0] : '',
      });
      cerrarModal();
      aviso('Categoría guardada');
      mostrar('ajustes');
    } catch (err) {
      aviso(err.message, true);
      e.target.disabled = false;
    }
  };
}
</script>
